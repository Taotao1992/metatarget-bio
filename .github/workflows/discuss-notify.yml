name: Discuss notify

# 团队讨论区新动态邮件提醒：每小时检查一次，有新话题/评论则发摘要邮件。
# 与 meeting-reminder 共用 secrets（见 tools/reminder/README.md）。
# 游标存于 Supabase mtb_notify_state 表（需先执行 tools/supabase/notify-state.sql）。

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: '发送测试邮件（无视游标，发最近 24 小时动态）'
        type: boolean
        default: true

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install nodemailer
        run: npm install nodemailer@6 --no-save

      - name: Check new discussion activity and notify
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REMINDER_TO: ${{ secrets.REMINDER_TO }}
          MTB_SUPABASE_URL: ${{ secrets.MTB_SUPABASE_URL }}
          MTB_SUPABASE_ANON_KEY: ${{ secrets.MTB_SUPABASE_ANON_KEY }}
          MTB_SHARED_SECRET: ${{ secrets.MTB_SHARED_SECRET }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test == 'true' && '1' || '0' }}
        run: node tools/reminder/notify-new.mjs
