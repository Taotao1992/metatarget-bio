<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>元靶科技 MetaTarget bio · 内部知识库</title>
<link rel="icon" type="image/png" href="assets/img/logo-icon.png">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/demo-lab.css">
<link rel="stylesheet" href="assets/css/archive.css">
<link rel="stylesheet" href="assets/css/input-hub.css">
<link rel="stylesheet" href="assets/css/discuss.css">
<style>
  body.locked { overflow: hidden; }
  .gate {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(900px 500px at 70% -10%, rgba(63, 214, 192, .08), transparent 60%),
      linear-gradient(rgba(63, 214, 192, .03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(63, 214, 192, .03) 1px, transparent 1px),
      #0a0f14;
    background-size: auto, 30px 30px, 30px 30px, auto;
    transition: opacity .35s ease;
  }
  .gate-off { opacity: 0; pointer-events: none; }
  .gate-card {
    width: min(380px, calc(100vw - 48px));
    background: linear-gradient(180deg, #131e2b, #0f1721);
    border: 1px solid #1f2d3d; border-radius: 14px;
    padding: 38px 34px 28px;
    box-shadow: 0 0 0 1px rgba(63, 214, 192, .06), 0 24px 70px rgba(0, 0, 0, .5), 0 0 60px rgba(63, 214, 192, .05);
    display: flex; flex-direction: column; gap: 10px;
  }
  .gate-brand { font-family: "Songti SC", "Noto Serif CJK SC", "STSong", serif; font-size: 27px; font-weight: 700; color: #e6edf4; letter-spacing: .04em; }
  .gate-en { font-size: 12.5px; color: #3fd6c0; letter-spacing: .12em; font-family: "SF Mono", Menlo, Consolas, monospace; }
  .gate-note { font-size: 12px; color: #e8b34b; margin: 4px 0 14px; }
  .gate-card label { font-size: 13px; color: #9db0c1; }
  .gate-card input[type="password"] {
    font-size: 16px; padding: 11px 13px; border: 1px solid #1f2d3d; border-radius: 8px;
    background: #0a0f14; color: #e6edf4; outline: none;
    font-family: "SF Mono", Menlo, Consolas, monospace; letter-spacing: .12em;
  }
  .gate-card input[type="password"]:focus { border-color: #3fd6c0; box-shadow: 0 0 0 3px rgba(63, 214, 192, .15); }
  .gate-card button {
    margin-top: 6px; padding: 11px 12px; font-size: 15px; font-weight: 600; cursor: pointer;
    background: linear-gradient(135deg, #2fbfaa, #23a393); color: #06211d; border: none; border-radius: 8px;
    box-shadow: 0 4px 22px rgba(63, 214, 192, .3);
  }
  .gate-card button:hover:not(:disabled) { box-shadow: 0 6px 28px rgba(63, 214, 192, .45); }
  .gate-card button:disabled { opacity: .6; cursor: default; }
  .gate-remember { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: #9db0c1; cursor: pointer; margin: -2px 0 8px; }
  .gate-remember input { accent-color: #3fd6c0; }
  .gate-remember-note { color: #e8b34b; font-size: 11.5px; }
  .gate-err { font-size: 13px; color: #f08a7e; }
  .gate-foot { margin-top: 14px; font-size: 11px; color: #64788c; line-height: 1.6; }
  @media (prefers-reduced-motion: reduce) { .gate { transition: none; } }
</style>
</head>
<body class="locked">

<div class="progress-bar" id="progressBar" aria-hidden="true"></div>

<header class="topbar">
  <button id="menuToggle" class="menu-toggle" aria-label="打开导航" aria-expanded="false">☰</button>
  <span class="topbar-title">元靶科技 <span class="topbar-en">MetaTarget bio</span> · 内部知识库</span>
</header>

<nav class="sidebar" id="sidebar" aria-label="全站导航">
  <div class="brand">
    <div class="brand-row"><img class="brand-logo" src="assets/img/logo-icon.png" alt="MetaTarget bio 标识"><div>
    <div class="brand-name">元靶科技</div>
    <div class="brand-en">MetaTarget bio</div>
    </div></div>
    <div class="brand-sub">药企靶点立项决策 × 可核验证据</div>
    <div class="brand-tag">内部参考 · 请勿外传</div>
  </div>
  <div class="search-box">
    <input type="search" id="searchInput" placeholder="搜索全站内容…" autocomplete="off" aria-label="全文搜索">
    <div class="search-results" id="searchResults" hidden></div>
  </div>
  <ul class="nav-list" id="navList"></ul>
  <div class="sidebar-foot">
    内容底稿：2026-07 整合版<br>
    纯静态构建 · 无任何外部请求
  </div>
</nav>
<div class="sidebar-mask" id="sidebarMask" hidden></div>

<main class="main" id="main">
  <article id="pageRoot" class="page"></article>
</main>

<button id="backTop" class="back-top" aria-label="返回顶部" hidden>↑</button>

<footer class="site-footer">内部参考资料｜含团队规划与未发表工作抽象描述｜请勿外传</footer>

<div class="gate" id="gate">
  <form class="gate-card" id="gateForm">
    <img class="gate-logo" src="assets/img/logo-icon.png" alt="MetaTarget bio 标识">
    <div class="gate-brand">元靶科技</div>
    <div class="gate-en">MetaTarget bio · 内部知识库</div>
    <p class="gate-note">内部参考 · 请勿外传 · 请输入访问密码</p>
    <label for="gatePw">访问密码</label>
    <input type="password" id="gatePw" autocomplete="current-password" required>
    <label class="gate-remember"><input type="checkbox" id="gateRemember" checked> 在这台设备上记住 30 天<span class="gate-remember-note">共用电脑请勿勾选</span></label>
    <button type="submit" id="gateBtn">进入</button>
    <div class="gate-err" id="gateErr" hidden>密码错误，请重试</div>
    <div class="gate-foot">内容经加密保护，解密在您的浏览器本地完成。<br>内部参考资料｜请勿外传</div>
  </form>
</div>

<script src="assets/js/vendor-quill.js"></script>
<script src="assets/js/vendor-purify.js"></script>
<script src="assets/js/payload.js"></script>
<script src="assets/js/gate.js"></script>
</body>
</html>
